# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Windows: Kotlin IC + kapt a veces fallan al cerrar cachés mmap (.tab) con:
# "La operación solicitada no se puede realizar en un archivo con una sección asignada a usuario abierta"
# (antivirus, indexador, segundo Gradle/IDE, OneDrive). Desactivar IC evita el bloqueo; el build es algo más lento.
kotlin.incremental=false
kapt.incremental.apt=false

# Windows: menos escrituras concurrentes en intermediates (dex, merge, etc.)
org.gradle.parallel=false
org.gradle.workers.max=2
